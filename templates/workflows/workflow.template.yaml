api_version: v1
kind: Workflow
metadata:
  name: WORKFLOW_NAME  # Replace with workflow name (lowercase_snake_case)
  version: 1.0.0
  description: Brief description of what this workflow does
  tags: [category, type]  # Add relevant tags

spec:
  coordination: sequential  # sequential, parallel, democratic, hierarchical
  
  steps:
    - id: step_1
      name: "Step 1 Name"
      agent: agent_name
      input:
        task: "Task description"
      output_var: step_1_result
      timeout: 180
    
    - id: step_2
      name: "Step 2 Name"
      agent: another_agent
      input:
        task: "Next task"
        data: "${step_1_result}"
      output_var: step_2_result
      depends_on: [step_1]
      timeout: 120

  error_handling:
    retry_failed_steps: true
    max_retries: 2
    continue_on_error: false
  
  outputs:
    final_result: "${step_2_result}"
